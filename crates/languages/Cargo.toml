[package]
name = "languages"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
doctest = false

[features]
test-support = [
    "load-grammars"
]
load-grammars = [
    "grammars/load-grammars",
    "tree-sitter",
    "tree-sitter-gitcommit",
]

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-fs.workspace = true
async-tar.workspace = true
async-trait.workspace = true
collections.workspace = true
futures.workspace = true
github_releases.workspace = true
gpui.workspace = true
grammars.workspace = true
json_schema_store.workspace = true
language.workspace = true
lazarus_project.workspace = true
lsp.workspace = true
node_runtime.workspace = true
project.workspace = true
regex.workspace = true
serde_json.workspace = true
settings.workspace = true
semver.workspace = true
smol.workspace = true
task.workspace = true
tree-sitter = { workspace = true, optional = true , features = ["wasm"] }
tree-sitter-gitcommit = { workspace = true, optional = true }
url.workspace = true
util.workspace = true

[dev-dependencies]
language = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tree-sitter-pascal.workspace = true
tree-sitter = { workspace = true, features = ["wasm"] }
