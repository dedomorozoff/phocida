[package]
name = "grammars"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/grammars.rs"
test = false
doctest = false

[dependencies]
anyhow.workspace = true
language_core.workspace = true
rust-embed.workspace = true
util.workspace = true

tree-sitter = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-diff = { workspace = true, optional = true }
tree-sitter-gitcommit = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-lfm = { workspace = true, optional = true }
tree-sitter-lpi = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
tree-sitter-pascal = { workspace = true, optional = true }
tree-sitter-regex = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }

[features]
load-grammars = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-diff",
    "tree-sitter-gitcommit",
    "tree-sitter-json",
    "tree-sitter-lfm",
    "tree-sitter-lpi",
    "tree-sitter-md",
    "tree-sitter-pascal",
    "tree-sitter-regex",
    "tree-sitter-rust",
    "tree-sitter-yaml",
]
test-support = ["load-grammars", "tree-sitter/wasm"]
