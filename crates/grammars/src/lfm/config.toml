name = "LFM"
grammar = "lfm"
path_suffixes = ["lfm"]
# The format has no comments: `{` opens a binary property blob.
autoclose_before = "=)]>,"
brackets = [
    { start = "[", end = "]", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    { start = "<", end = ">", close = false, newline = false },
]
tab_size = 2
